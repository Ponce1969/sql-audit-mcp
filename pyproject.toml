[project]
name = "herraminetas-sql"
version = "0.2.1"
description = "Auditor centralizado de salud de índices y almacenamiento en PostgreSQL"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
sql-audit = "audit_pg:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audit_pg.py"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0",
    "ruff>=0.16.8",
    "types-psycopg2>=2.9.21.20260911",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
